plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'

    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

sourceCompatibility = 11
targetCompatibility = 11

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Test fixtures generate a throwaway keypair and self-signed cert to sign SAML assertions.
    testImplementation 'org.bouncycastle:bcpkix-jdk15on:1.64'

    // This dependency is used by the application.
    implementation libs.guava

    implementation "org.opensaml:opensaml-core:$opensamlVersion"
    implementation "org.opensaml:opensaml-saml-impl:$opensamlVersion"
    implementation "org.opensaml:opensaml-soap-api:$opensamlVersion"
    implementation "org.opensaml:opensaml-xmlsec-api:$opensamlVersion"
    implementation "org.opensaml:opensaml-security-api:$opensamlVersion"
    implementation "org.opensaml:opensaml-security-impl:$opensamlVersion"
    implementation "org.opensaml:opensaml-profile-api:$opensamlVersion"

    implementation "org.slf4j:slf4j-api:1.7.36"
    implementation "org.slf4j:slf4j-simple:1.7.36"

    // OpenSAML 4.0.1 resolves these transitively at versions with published CVEs. Raised to the last
    // releases on each line OpenSAML 4 is compatible with; xmlsec stays on 2.x because 3.x and later
    // need OpenSAML 5.
    constraints {
        implementation( "org.apache.santuario:xmlsec:2.3.4" ) { because "CVE-2021-40690, fixed in 2.2.3" }
        implementation( "com.fasterxml.woodstox:woodstox-core:6.7.0" ) { because "CVE-2022-40151/40152, fixed in 6.4.0" }
        implementation( "org.apache.httpcomponents:httpclient:4.5.14" ) { because "CVE-2020-13956, fixed in 4.5.13" }
        implementation( "commons-io:commons-io:2.18.0" ) { because "CVE-2021-29425, fixed in 2.7" }
        implementation( "org.apache.velocity:velocity-engine-core:2.4.1" ) { because "CVE-2020-13936, fixed in 2.3" }
    }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'cbsso.opensaml.App'
}

jar {
    archiveBaseName = "cbsso-opensaml"
}

shadowJar {
	archiveBaseName = "cbsso-opensaml"
    mergeServiceFiles()
    dependencies {
        exclude(dependency('org.apache.commons:commons-lang3'))
    }
	minimize{
        exclude( dependency( "org.opensaml:opensaml-core:.*" ) )
        exclude( dependency( "org.slf4j:.*:.*" ) )
        exclude( dependency( "org.opensaml:opensaml-saml-impl:.*" ) )
        exclude( dependency( "org.opensaml:opensaml-soap-api:.*" ) )
        exclude( dependency( "org.opensaml:opensaml-xmlsec-api:.*" ) )
        exclude( dependency( "org.opensaml:opensaml-security-api:.*" ) )
        exclude( dependency( "org.opensaml:opensaml-security-impl:.*" ) )
        exclude( dependency( "org.opensaml:opensaml-profile-api:.*" ) )
	}
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
