name: Build a Release

on:
  # A push to main triggers a stable release
  push:
    branches:
      - main

  # Reusable workflow : Usually called by a `snapshot` workflow
  workflow_call:
    inputs:
      snapshot:
          description: 'Is this a snapshot build?'
          required: false
          default: false
          type: boolean

env:
  MODULE_ID: cbsso
  SNAPSHOT: ${{ inputs.snapshot || false }}

jobs:
  ##########################################################################################
  # Build & Publish
  ##########################################################################################
  build:
    name: Build & Publish
    runs-on: ubuntu-22.04
    # Queue stable releases rather than letting duplicate runs race or cancel a publish.
    concurrency:
      group: ${{ (inputs.snapshot || false) && format('snapshot-{0}', github.ref) || 'stable-release' }}
      cancel-in-progress: false
    outputs:
      release_version: ${{ steps.current_version.outputs.version }}
      release_commit: ${{ steps.release_revision.outputs.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
        with:
          forgeboxAPIKey: ${{ secrets.FORGEBOX_TOKEN }}

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"

      - name: "Setup Environment Variables For Build Process"
        id: current_version
        run: |
          version=$(jq -r '.version' box.json)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          box package set version=@build.version@+@build.number@
          # Stable release or development snapshot
          echo "Github Ref is $GITHUB_REF"
          echo "BRANCH=main" >> $GITHUB_ENV
          if [ $GITHUB_REF == 'refs/heads/development' ]
          then
            echo "BRANCH=development" >> $GITHUB_ENV
          fi

      - name: Guard Stable Release
        if: env.SNAPSHOT == 'false'
        shell: bash
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo "::error::Stable releases must run from main."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Stable releases require a major.minor.patch version, got: $VERSION"
            exit 1
          fi

          # Query the remote, since checkout may not have fetched existing tags.
          # A network/authentication error must fail the step, not look like a missing tag.
          existing_tag=$(git ls-remote --tags origin "refs/tags/v${VERSION}")
          if [ -n "$existing_tag" ]; then
            echo "::error::v${VERSION} already exists. Refusing to finalize or publish it again. Inspect any partial release manually; do not move the tag."
            exit 1
          fi

      - name: Update changelog [unreleased] with latest version
        uses: thomaseizinger/keep-a-changelog-new-release@1.3.0
        if: env.SNAPSHOT == 'false'
        with:
          changelogPath: ./changelog.md
          tag: v${{ env.VERSION }}

      - name: Build ${{ env.MODULE_ID }}
        run: |
          npm install -g markdownlint-cli
          markdownlint changelog.md --fix
          chmod +x java/cbsso-opensaml/gradlew
          box task run taskfile=tasks/Build :version=${{ env.VERSION }} :projectName=${{ env.MODULE_ID }} :buildID=${{ github.run_number }} :branch=${{ env.BRANCH }}

      - name: Commit Changelog To Main
        uses: EndBug/add-and-commit@v9.1.1
        if: env.SNAPSHOT == 'false'
        with:
          author_name: Github Actions
          author_email: info@ortussolutions.com
          message: 'Finalized changelog for v${{ env.VERSION }}'
          add: changelog.md

      # Capture the finalized commit, not the original push SHA or a later main revision.
      - name: Record Release Revision
        id: release_revision
        if: env.SNAPSHOT == 'false'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tag Version Without Overwriting
        if: env.SNAPSHOT == 'false'
        env:
          RELEASE_COMMIT: ${{ steps.release_revision.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" "$RELEASE_COMMIT" -m "Release v${VERSION}"
          # A concurrent tag creation must fail here, before publishing any artifacts.
          git push origin "refs/tags/v${VERSION}"

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODULE_ID }}
          path: |
            .artifacts/**/*
            changelog.md

      - name: Upload Binaries to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read
        env:
          AWS_S3_BUCKET: "downloads.ortussolutions.com"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
          SOURCE_DIR: ".artifacts/${{ env.MODULE_ID }}"
          DEST_DIR: "ortussolutions/coldbox-modules/${{ env.MODULE_ID }}"

      - name: Publish To ForgeBox
        run: |
          cd .tmp/${{ env.MODULE_ID }}
          cat box.json
          if [ "$SNAPSHOT" == 'true' ]; then
            box forgebox publish --force
          else
            box forgebox publish
          fi

      - name: Create Github Release
        uses: taiki-e/create-gh-release-action@v1.6.2
        if: env.SNAPSHOT == 'false'
        with:
          title: ${{ env.VERSION }}
          changelog: changelog.md
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refs/tags/v${{ env.VERSION }}

  ##########################################################################################
  # Prep Next Release
  ##########################################################################################
  prep_next_release:
    name: Prep Next Release
    if: github.ref == 'refs/heads/main' && needs.build.outputs.release_commit != ''
    runs-on: ubuntu-22.04
    needs: [ build ]
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: prepare-release-${{ needs.build.outputs.release_version }}
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
      RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Setup CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1

      - name: Prepare Release Merge
        id: prepare
        shell: bash
        run: |
          branch="automation/prepare-after-v${RELEASE_VERSION}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          # Do not recreate an already reviewed, merged, or closed preparation PR.
          existing_pr=$(gh pr list --base development --head "$branch" --state all --json url --jq '.[0].url // empty')
          if [ -n "$existing_pr" ]; then
            echo "Preparation PR already exists: $existing_pr"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Recover a previous attempt that pushed successfully but failed to open its PR.
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git switch --create "$branch" "origin/$branch"
            git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD
          else
            git switch --create "$branch"
            if ! git merge --no-ff "$RELEASE_COMMIT" -m "Merge release v${RELEASE_VERSION} into development"; then
              echo "::error::Release merge conflicts. No branch was pushed and development is unchanged. Resolve the release merge manually."
              git merge --abort
              exit 1
            fi
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check Development Version
        id: version
        if: steps.prepare.outputs.ready == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          def version(value):
              if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", value):
                  raise SystemExit(f"Expected a stable major.minor.patch version, got {value!r}")
              return tuple(map(int, value.split(".")))

          with open("box.json") as package:
              current = json.load(package)["version"]
          released = os.environ["RELEASE_VERSION"]
          if version(current) < version(released):
              raise SystemExit(f"Development version {current} is behind released version {released}; review manually")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"bump={'true' if version(current) == version(released) else 'false'}\n")
          print(f"Development: {current}; released: {released}")
          PY

      - name: Bump Development Version Once
        if: steps.version.outputs.bump == 'true'
        run: |
          box bump --minor --!TagVersion
          git add box.json
          git commit -m "Prepare next minor version after v${RELEASE_VERSION}"

      - name: Open Preparation PR
        if: steps.prepare.outputs.ready == 'true'
        env:
          PREPARATION_BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          # Never force-push or update development directly.
          git push origin "$PREPARATION_BRANCH"
          gh pr create \
            --base development \
            --head "$PREPARATION_BRANCH" \
            --title "Prepare development after v${RELEASE_VERSION}" \
            --body "Merges finalized release commit ${RELEASE_COMMIT} into development, preserving its history and unreleased changes. Advances the minor version only if development is still at ${RELEASE_VERSION}. Review the changelog and version before merging. Use a merge commit (not squash or rebase) to preserve release ancestry."
          echo "::notice::PRs created with GITHUB_TOKEN do not trigger PR workflows automatically. Run the checks explicitly or close and reopen the PR with a maintainer account before merging."
